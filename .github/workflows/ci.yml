# Lint and build the frontend, then run the API smoke tests against the Vercel function (api/index.js).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend

  api-smoke:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8 # same major version as Atlas
        ports: ["27017:27017"]
    # throwaway values for the runner's own database; nothing here is a real secret
    env:
      PORT: 4000
      MONGO_URI: mongodb://localhost:27017/brewed-ci
      JWT_SECRET: ci-only-jwt-secret
      SEED_PASSWORD: ci-only-seed-password
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install (same as vercel.json)
        run: npm ci --prefix backend --omit=dev
      - run: npm run seed --prefix backend
      - name: Start the Vercel function
        run: |
          node backend/scripts/serve-vercel.mjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/api/health && exit 0; sleep 1; done
          exit 1
      - run: npm run smoke --prefix backend
      - name: Server log
        if: always()
        run: cat server.log
